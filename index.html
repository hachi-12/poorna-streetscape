<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Poorna Market - 360 VR Showcase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  
  <!-- A-Frame VR Library -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    /* Reset & Full Screen Layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
    }

    /* Top Header Bar */
    #header-bar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 20px;
      border-radius: 30px;
      color: #ffffff;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      pointer-events: none;
    }
    #header-bar h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    #header-bar p {
      font-size: 11px;
      color: #cbd5e1;
    }

    /* Bottom Thumbnail Navigation Overlay */
    #ui-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 90%;
      max-width: 1000px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 12px 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .thumbnail-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 4px;
    }

    /* Scrollbar Styling */
    .thumbnail-scroll::-webkit-scrollbar {
      height: 4px;
    }
    .thumbnail-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
    }

    .nav-card {
      flex: 0 0 auto;
      width: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 4px;
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-card:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.12);
    }

    .nav-card.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .nav-card img {
      width: 100%;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      background-color: #334155;
    }

    .nav-card span {
      margin-top: 6px;
      font-size: 11px;
      color: #f8fafc;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* Instructions Overlay helper if image fails */
    #status-msg {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(239, 68, 68, 0.9);
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Title Banner -->
  <div id="header-bar">
    <h1>POORNA MARKET DESIGN TOUR</h1>
    <p>360° Architectural Experience</p>
  </div>

  <!-- Status alert for missing images -->
  <div id="status-msg">Panorama image not found. Ensure image file exists in main directory.</div>

  <!-- Bottom Navigation Bar matching reference UI -->
  <div id="ui-container">
    <div class="thumbnail-scroll" id="thumb-list">
      <!-- Generated via JS -->
    </div>
  </div>

  <!-- 360 WebVR Scene -->
  <a-scene webxr="optionalFeatures: hit-test" loading-screen="enabled: false">
    
    <!-- Asset Management (NO SUBFOLDERS - All files in root folder) -->
    <a-assets timeout="10000">
      <img id="pano1" src="poornmarket1.png" crossorigin="anonymous">
      <img id="pano2" src="pano2.jpg" crossorigin="anonymous">
      <img id="pano3" src="pano3.jpg" crossorigin="anonymous">
      <img id="pano4" src="pano4.jpg" crossorigin="anonymous">
      <img id="pano5" src="pano5.jpg" crossorigin="anonymous">
      <img id="pano6" src="pano6.jpg" crossorigin="anonymous">
      <img id="pano7" src="pano7.jpg" crossorigin="anonymous">
      <img id="pano8" src="pano8.jpg" crossorigin="anonymous">
      <img id="pano9" src="pano9.jpg" crossorigin="anonymous">
      <img id="pano10" src="pano10.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- Camera Setup & Gaze Reticle for VR Headsets -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="camera" look-controls touch-controls>
        <!-- Center Gaze Reticle for hands-free VR -->
        <a-cursor
          id="cursor"
          raycaster="objects: .clickable"
          color="#38bdf8"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.022">
        </a-cursor>
      </a-camera>

      <!-- VR Controller support for Meta Quest -->
      <a-entity oculus-touch-controls="hand: left"></a-entity>
      <a-entity oculus-touch-controls="hand: right" raycaster="objects: .clickable" laser-controls></a-entity>
    </a-entity>

    <!-- 360 Panorama Sky Sphere -->
    <a-sky id="mainSky" src="#pano1" material="color: #1e293b" rotation="0 -90 0"></a-sky>

    <!-- 360° Header Indicator Badge in 3D Space (Matching Reference Image) -->
    <a-entity id="vr360Badge" position="0 2.2 -3" rotation="10 0 0">
      <a-plane width="0.7" height="0.25" color="#000000" opacity="0.45" radius="0.05">
        <a-text value="360°" align="center" color="#FFFFFF" scale="0.8 0.8 0.8" position="0 0 0.01"></a-text>
      </a-plane>
    </a-entity>

    <!-- 3D Spatial Navigation Hotspots (Forward, Left, Right Arrows on Promenade Ground) -->
    <a-entity id="spatialHotspots">
      <!-- Forward Arrow -->
      <a-entity id="arrowForward" class="clickable" position="0 0.1 -2.2" rotation="-70 0 0" onclick="navigateHotspot('forward')">
        <a-circle radius="0.22" color="#ffffff" opacity="0.85">
          <a-text value="^" align="center" color="#000000" position="0 0 0.01" scale="1.2 1.2 1.2"></a-text>
        </a-circle>
      </a-entity>

      <!-- Left Arrow -->
      <a-entity id="arrowLeft" class="clickable" position="-1.6 0.5 -2.0" rotation="-30 35 0" onclick="navigateHotspot('left')">
        <a-circle radius="0.2" color="#ffffff" opacity="0.85">
          <a-text value="<" align="center" color="#000000" position="0 0 0.01" scale="0.9 0.9 0.9"></a-text>
        </a-circle>
      </a-entity>

      <!-- Right Arrow -->
      <a-entity id="arrowRight" class="clickable" position="1.6 0.5 -2.0" rotation="-30 -35 0" onclick="navigateHotspot('right')">
        <a-circle radius="0.2" color="#ffffff" opacity="0.85">
          <a-text value=">" align="center" color="#000000" position="0 0 0.01" scale="0.9 0.9 0.9"></a-text>
        </a-circle>
      </a-entity>
    </a-entity>

    <!-- Floating Spatial VR Menu (Visible inside VR Headsets) -->
    <a-entity id="vrHUD" position="0 1.2 -2.2" rotation="-15 0 0">
      <a-plane width="2.2" height="0.4" color="#0f172a" opacity="0.85" border="1 #38bdf8">
        <a-text id="vrStatusText" value="Current View: Main Entry" align="center" position="0 0.05 0.01" scale="0.4 0.4 0.4" color="#ffffff"></a-text>
        <a-text value="Use bottom menu or gaze at buttons" align="center" position="0 -0.1 0.01" scale="0.22 0.22 0.22" color="#94a3b8"></a-text>
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    // List of your 10 design spaces matching Poorna Market zones
    const spaces = [
      { id: 'pano1', title: 'Main Entry', file: 'poornmarket1.png' },
      { id: 'pano2', title: 'Grocery Lane', file: 'pano2.jpg' },
      { id: 'pano3', title: 'Textile Street', file: 'pano3.jpg' },
      { id: 'pano4', title: 'Vendor Court', file: 'pano4.jpg' },
      { id: 'pano5', title: 'Food Street', file: 'pano5.jpg' },
      { id: 'pano6', title: 'Community Plaza', file: 'pano6.jpg' },
      { id: 'pano7', title: 'Admin / Services', file: 'pano7.jpg' },
      { id: 'pano8', title: 'Central Courtyard', file: 'pano8.jpg' },
      { id: 'pano9', title: 'Artisans Hub', file: 'pano9.jpg' },
      { id: 'pano10', title: 'Flower Market', file: 'pano10.jpg' }
    ];

    let currentIndex = 0;

    const thumbList = document.getElementById('thumb-list');
    const sky = document.getElementById('mainSky');
    const vrStatusText = document.getElementById('vrStatusText');
    const statusMsg = document.getElementById('status-msg');

    // Directional spatial hotspot walker
    function navigateHotspot(direction) {
      if (direction === 'forward') {
        currentIndex = (currentIndex + 1) % spaces.length;
      } else if (direction === 'left') {
        currentIndex = (currentIndex - 1 + spaces.length) % spaces.length;
      } else if (direction === 'right') {
        currentIndex = (currentIndex + 2) % spaces.length;
      }
      switchPanorama(spaces[currentIndex]);
    }

    // Build the bottom thumbnail toolbar dynamically
    spaces.forEach((space, index) => {
      const card = document.createElement('div');
      card.className = `nav-card ${index === 0 ? 'active' : ''}`;
      card.id = `card-${space.id}`;
      
      // If the image hasn't been uploaded yet, it falls back to a colored block safely
      card.innerHTML = `
        <img src="${space.file}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'110\\' height=\\'60\\' viewBox=\\'0 0 110 60\\'><rect width=\\'110\\' height=\\'60\\' fill=\\'%23334155\\'/><text x=\\'50%\\' y=\\'55%\\' fill=\\'%2394a3b8\\' font-size=\\'10\\' text-anchor=\\'middle\\'>360 Image</text></svg>'" alt="${space.title}">
        <span>${space.title}</span>
      `;

      card.onclick = () => switchPanorama(space);
      thumbList.appendChild(card);
    });

    // Function to switch 360 panorama views
    function switchPanorama(space) {
      currentIndex = spaces.findIndex(s => s.id === space.id);

      // Highlight active thumbnail
      document.querySelectorAll('.nav-card').forEach(c => c.classList.remove('active'));
      const activeCard = document.getElementById(`card-${space.id}`);
      if (activeCard) activeCard.classList.add('active');

      // Update 360 Sky texture
      sky.setAttribute('src', `#${space.id}`);

      // Update spatial VR text
      if (vrStatusText) {
        vrStatusText.setAttribute('value', `Current View: ${space.title}`);
      }

      // Pre-check if image exists
      const imgCheck = new Image();
      imgCheck.src = space.file;
      imgCheck.onerror = () => {
        statusMsg.innerText = `File missing: Please save "${space.file}" in your main GitHub directory.`;
        statusMsg.style.display = 'block';
        setTimeout(() => { statusMsg.style.display = 'none'; }, 4000);
      };
      imgCheck.onload = () => {
        statusMsg.style.display = 'none';
      };
    }
  </script>
</body>
</html>
