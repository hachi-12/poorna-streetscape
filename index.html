<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Poorna Market VR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- A-Frame Framework -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden; background-color: #000;">

  <a-scene webxr="optionalFeatures: hit-test">
    
    <!-- 1. Assets Manager (Always use local relative paths) -->
    <a-assets>
      <!-- Put your exported Enscape 360 JPG inside the assets/ folder -->
      <img id="marketPano" src="assets/pano_market.jpg">
      <img id="mapImg" src="assets/mini_map.png">
    </a-assets>

    <!-- 2. Camera Rig & Gaze Reticle -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="camera" look-controls touch-controls>
        <!-- Center Gaze Pointer -->
        <a-cursor
          id="cursor"
          raycaster="objects: .clickable"
          color="#00E5FF"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025">
        </a-cursor>
      </a-camera>

      <!-- Quest Controllers -->
      <a-entity oculus-touch-controls="hand: left"></a-entity>
      <a-entity oculus-touch-controls="hand: right" raycaster="objects: .clickable" laser-controls></a-entity>
    </a-entity>

    <!-- 3. 360 Background (Default color fallback prevents white screen) -->
    <a-sky id="mainSky" src="#marketPano" color="#1a1a1a" rotation="0 -90 0"></a-sky>

    <!-- 4. VR Spatial HUD Console (Floats 2.5m in front of user) -->
    <a-entity id="hudConsole" position="0 1.4 -2.5">
      
      <!-- Console Base Frame -->
      <a-plane width="2.4" height="0.8" color="#0f172a" opacity="0.85" position="0 0 0"></a-plane>

      <!-- Mini-Map Section (Left) -->
      <a-plane id="miniMap" src="#mapImg" color="#334155" width="0.6" height="0.6" position="-0.75 0 0.01"></a-plane>

      <!-- Interactive Scene Buttons (Right) -->
      <a-entity position="0.3 0 0.01">
        
        <!-- Button 1: Entry Plaza -->
        <a-plane class="clickable" width="0.8" height="0.25" color="#0284c7" position="0 0.18 0" onclick="changePano('#marketPano')">
          <a-text value="Main Entry" align="center" color="#FFFFFF" scale="0.35 0.35 0.35"></a-text>
        </a-plane>

        <!-- Button 2: Vendor Lane -->
        <a-plane class="clickable" width="0.8" height="0.25" color="#0f766e" position="0 -0.18 0" onclick="alert('Add second panorama path in assets/')">
          <a-text value="Vendor Lane" align="center" color="#FFFFFF" scale="0.35 0.35 0.35"></a-text>
        </a-plane>

      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    // Function to switch 360 images safely
    function changePano(assetId) {
      const sky = document.getElementById('mainSky');
      sky.setAttribute('src', assetId);
    }
  </script>
</body>
</html>
